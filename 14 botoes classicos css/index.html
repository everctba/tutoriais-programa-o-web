<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel UI JavaFX Portado para Web</title>
    <link rel="stylesheet" href="buttonsStuleCSS.css">

    <style>
        body {
            background-color: #d1d5db;
            font-family: Arial, sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            padding: 50px;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <button id="green">Green Button</button>
    <button id="round-red">Round Red</button>
    <button id="bevel-grey">Bevel Grey</button>
    <button id="glass-grey">Glass Grey</button>
    <button id="shiny-orange">Shiny Orange</button>
    <button id="dark-blue">Dark Blue</button>
    <button id="record-sales">Record Sales</button>
    <button id="rich-blue">Rich Blue</button>
    <button id="big-yellow">Big Yellow</button>
    <button id="iphone-toolbar">iPhone Toolbar</button>
    <button id="iphone">iPhone Button</button>
    <button id="ipad-dark-grey">iPad Dark Grey</button>
    <button id="ipad-grey">iPad Grey Light</button>
    <button id="lion-default">Mac Lion Default</button>
    <button id="lion">Mac Lion Normal</button>
    <button id="windows7-default">Win7 Default</button>
    <button id="windows7">Win7 Normal</button>
    <button id="aqua">Mac OS X Aqua</button>

    <!-- Representações adicionadas da Referência Fotográfica de Confirmação clássica -->
    <button id="mac-classic-grey">Cancel</button>
    <button id="mac-classic-blue">Save</button>
</body>

</html>
